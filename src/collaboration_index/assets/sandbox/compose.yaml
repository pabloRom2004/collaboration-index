services:
  default:
    image: python:3.12-slim@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f
    command: ["sleep", "infinity"]
    user: "65534:65534"
    working_dir: /workspace
    network_mode: none
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 2
    mem_limit: 1g
    tmpfs:
      - /workspace:rw,size=16777216,mode=0770,uid=65534,gid=65534
      - /tmp:rw,size=16777216,mode=1777
