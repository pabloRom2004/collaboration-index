.grid-pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid-pair h4{font-size:11px;font-weight:600;color:#5d6a61;margin:0 0 7px}.square-grid{display:grid;grid-template-columns:repeat(var(--side),minmax(0,1fr));gap:3px}.square-grid .cell{height:auto;aspect-ratio:1;font-size:10.5px}.cell.wrong{background:#fbe9e7;border-color:#efc4be;color:#b04a40;font-weight:600}.cell.dupe{background:#fbf0d9;border-color:#e6c983;color:#8a6d22;font-weight:600}.cell.held{color:#46604b;border-color:#d5ddd6}.cell.unheld{background:#fbe9e7;border-style:dashed;color:#b04a40}.hand-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}.hand-name{font-size:11px;width:104px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#46604b}.cell.vacant{border-style:dashed;background:#fafbfa}.cell.latest{outline:2px solid #2f6b4a;outline-offset:1px;z-index:1}.cell .who{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:#2f6b4a;color:#fff;border-radius:6px;font-size:8.5px;line-height:12px;padding:0 4px;white-space:nowrap;font-weight:400;z-index:2}
.sequence,.mono-row{display:flex;flex-wrap:wrap;gap:3px}.mono-row{margin-bottom:7px}.mono-row .label{font-size:10px;color:var(--muted);width:44px;flex-shrink:0;align-self:center}.chip{font:11px ui-monospace,Menlo,monospace;min-width:22px;padding:4px 5px;text-align:center;border-radius:4px;background:#eef5ef;color:#3f7a50}.chip.bad{background:#fbe9e7;color:#b04a40}.chip.pending{background:#f3f5f3;color:#a3aca5}

<body>
<main>
  <div class="workspace">
    <section class="agent-panel" aria-label="Agent map">
      <div id="map-view">
        <div class="map-surface"><svg class="scene" id="scene" viewBox="0 0 2000 1000" preserveAspectRatio="xMinYMid meet" aria-label="Interactive agent map"><defs><filter id="mail-shadow"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#587562" flood-opacity=".12"/></filter></defs><g id="scene-world"><g id="scene-background"></g><g id="connection-layer"></g><g id="mail-layer"></g><g id="scene-title"></g><g id="global-node"></g><g id="computer-nodes"></g><g id="target-board"></g><g id="number-layer" pointer-events="none"></g></g></svg></div>
        <div class="map-tools"><select id="agent-picker" class="agent-picker" aria-label="Choose an agent"><option value="">Choose an agent</option></select><button class="icon-button" id="zoom-out" aria-label="Zoom out">−</button><button class="icon-button" id="zoom-in" aria-label="Zoom in">+</button><button class="icon-button" id="fit-map" aria-label="Fit all agents">↗</button></div>
      </div>
    </section>
    <section class="board-panel" id="board-panel" aria-label="Message board">
      <div class="board-toolbar"><div class="team-summary" id="team-summary"></div><div class="board-actions"><span id="open-status" role="status"></span><a class="upload" id="source-hawk" target="_blank" rel="noopener noreferrer" hidden>Source .eval</a><a class="upload" id="source-local" hidden>Local .eval</a><button class="upload" id="open" disabled>Saved replay</button><input id="file-input" type="file" multiple accept=".eval,.jsonl"></div></div>
      <div class="refresh-controls" id="refresh-controls" hidden><label><input id="live-updates" type="checkbox">Live</label><label>Every <input id="refresh-minutes" type="number" min="0.1" step="0.1" value="1" aria-label="Refresh interval in minutes"> min</label><button id="refresh-now">Refresh now</button><span id="refresh-status" role="status"></span><span class="refresh-note" id="refresh-note"></span></div>
      <div class="view-tabs" id="view-tabs" role="tablist" aria-label="Board views" hidden><button class="view-tab" id="messages-view-tab" role="tab" aria-selected="true">Messages</button><button class="view-tab" id="target-view-tab" role="tab" aria-selected="false">Target &amp; progress</button></div>
      <div class="board-content">
        <div id="target-view" role="tabpanel" aria-labelledby="target-view-tab" hidden></div>
        <div id="global-view">
          <header class="panel-head"><h2 id="global-title">Global message board</h2><span class="count" id="global-count"></span></header>
          <input class="search" id="search" type="search" placeholder="Search global messages" aria-label="Search global messages">
          <div class="journal" id="journal"></div>
        </div>
        <div id="dm-view" hidden>
          <header class="dm-head"><button id="back-to-global" class="back-button" aria-label="Back to global message board"></button><div class="dm-heading"><h2 id="dm-title" class="dm-title"></h2><div class="model-subtitle" id="dm-model"></div></div><a class="source" id="source-link"></a></header>
          <div class="agent-tabs" role="tablist" aria-label="Agent details"><button class="agent-tab" id="dms-tab" role="tab" aria-selected="true" aria-controls="agent-dms">DMs</button><button class="agent-tab" id="flags-tab" role="tab" aria-selected="false" aria-controls="agent-details" tabindex="-1">Flags</button></div>
          <div class="agent-details" id="agent-details" role="tabpanel" aria-labelledby="flags-tab" tabindex="0" hidden></div>
          <div class="dm-body" id="agent-dms" role="tabpanel" aria-labelledby="dms-tab" tabindex="0">
            <nav class="dm-contacts" id="dm-contacts" aria-label="DM contacts"></nav>
            <div class="dm-conversation">
              <header class="dm-conversation-head" id="dm-conversation-head" hidden><h3 id="dm-peer-title"></h3><span class="count" id="dm-message-count"></span></header>
              <input class="search" id="dm-search" type="search" placeholder="Search conversation" aria-label="Search direct messages" hidden>
              <div class="journal dm-journal" id="dm-journal"></div>
            </div>
          </div>
        </div>
      </div>

    </section>
    <button id="toggle-panel" class="panel-toggle" aria-label="Hide message panel" title="Hide message panel" aria-controls="board-panel" aria-expanded="true"></button>
    <footer class="timeline">
        <div class="timeline-controls"><button class="timeline-button" id="previous-message" aria-label="Previous message"></button><button class="timeline-button play-button" id="play" aria-label="Play replay"></button><button class="timeline-button" id="next-message" aria-label="Next message"></button><button class="timeline-button" id="reset" aria-label="Restart replay"></button><span class="time-label" id="position"></span><div class="timeline-track"><input id="time" type="range" min="0" max="1000" value="1000" step="any" aria-label="Replay time"><div class="timeline-ticks" id="timeline-ticks"></div></div><span class="time-label" id="duration"></span><select class="speed" id="speed" aria-label="Playback speed"><option value="1">1×</option><option value="4">4×</option><option value="16" selected>16×</option><option value="64">64×</option></select></div>
        <div class="timeline-meta"><span id="stats"></span><span class="live-status" id="replay-status">Finished</span></div>
    </footer>
  </div>
</main>
<script type="application/json" id="data">__BOARD_EVENTS__</script>
<script>
'use strict';
let dataset=JSON.parse(document.getElementById('data').textContent);
if(Array.isArray(dataset))dataset={events:dataset,agents:[],flags:[]};

// Rebuilt from replay time on every frame, so seeking backwards simply empties later slots.

  };

function renderCounting(box,spec,entries){

$('zoom-in').onclick=()=>zoom(.8);$('zoom-out').onclick=()=>zoom(1.25);$('fit-map').onclick=fitMap;
$('scene').addEventListener('pointerdown',event=>{if(event.target.closest('.computer,.global-board'))return;drag={x:event.clientX,y:event.clientY,view:{...view}};dragged=false;$('scene').setPointerCapture(event.pointerId);$('scene').classList.add('dragging');});
$('scene').addEventListener('pointermove',event=>{if(!drag)return;const bounds=$('scene').getBoundingClientRect();const dx=(event.clientX-drag.x)*view.w/bounds.width,dy=(event.clientY-drag.y)*view.h/bounds.height;dragged=Math.abs(dx)+Math.abs(dy)>3;view.x=drag.view.x-dx;view.y=drag.view.y-dy;applyView();});
$('scene').addEventListener('pointerup',()=>{drag=null;$('scene').classList.remove('dragging');queueMicrotask(()=>dragged=false);});
$('scene').addEventListener('wheel',event=>{event.preventDefault();zoom(event.deltaY>0?1.08:.92);},{passive:false});
$('open').onclick=()=>$('file-input').click();
$('file-input').onchange=async()=>{
  stop();$('open-status').classList.remove('error');$('open-status').textContent='Opening…';
  try{
    const form=new FormData();for(const file of $('file-input').files)form.append('files',file);
    const response=await fetch('/api/open',{method:'POST',body:form,headers:{'X-Viewer-Token':document.querySelector('meta[name="viewer-import-token"]')?.content||''}});
    if(!response.ok){const detail=await response.json();throw new Error(detail.detail||'Could not open logs.');}
    dataset=await response.json();setup();$('open-status').textContent='';
  }catch(error){$('open-status').textContent=error.message;$('open-status').classList.add('error');}
};
let refreshTimer=null,refreshBusy=false;
function scheduleRefresh(){
  clearTimeout(refreshTimer);refreshTimer=null;
  if(!$('live-updates').checked)return;
  const minutes=Math.max(.1,Number($('refresh-minutes').value)||1);$('refresh-minutes').value=String(minutes);
  refreshTimer=setTimeout(refreshSnapshot,minutes*60000);
}
function replaceSnapshot(updated){
  const saved={time:currentTime,atEnd:Number($('time').value)>=1000&&!playing,playing,agent:selectedAgent,peer:selectedPeer,tab:selectedAgentTab,highlight:highlighted,view:{...view},search:$('search').value,dmSearch:$('dm-search').value};
  const scrolls=['journal','dm-journal'].map(id=>({id,top:$(id).scrollTop,atBottom:$(id).scrollHeight-$(id).scrollTop-$(id).clientHeight<70}));
  dataset=updated;setup();
  if(!saved.atEnd)$('time').value=Math.min(1000,Math.max(0,(saved.time-start)/(end-start)*1000));
  if(ids.includes(saved.agent)){selectedAgent=saved.agent;selectedPeer=saved.peer;selectedAgentTab=saved.tab;$('global-view').hidden=true;$('dm-view').hidden=false;}
  highlighted=saved.highlight;$('search').value=saved.search;$('dm-search').value=saved.dmSearch;view=saved.view;applyView();render(true);
  for(const scroll of scrolls)$(scroll.id).scrollTop=saved.atEnd&&scroll.atBottom?$(scroll.id).scrollHeight:scroll.top;
  if(saved.playing)play();
}
async function refreshSnapshot(){
  if(refreshBusy)return;
  refreshBusy=true;clearTimeout(refreshTimer);$('refresh-now').disabled=true;$('refresh-status').textContent='Updating…';
  try{
    const token=document.querySelector('meta[name="viewer-import-token"]')?.content||'';
    const response=await fetch('/api/state',{headers:{'X-Viewer-Token':token},cache:'no-store',signal:AbortSignal.timeout(50000)});
    if(!response.ok)throw new Error('Update unavailable');
    replaceSnapshot(await response.json());$('refresh-status').textContent='Updated '+new Date().toLocaleTimeString();$('refresh-status').dataset.status='updated';
  }catch(error){$('refresh-status').textContent='Update failed; previous view kept';$('refresh-status').dataset.status='error';}
  finally{refreshBusy=false;$('refresh-now').disabled=false;scheduleRefresh();}
}
const refreshSetting=document.querySelector('meta[name="viewer-refresh-minutes"]');
if(refreshSetting){
  const minutes=Number(refreshSetting.content);$('refresh-controls').hidden=false;$('refresh-minutes').value=String(minutes||1);$('live-updates').checked=minutes>0;
  $('refresh-note').textContent=document.querySelector('meta[name="viewer-refresh-note"]')?.content||'Updates the selected board journal and saved logs.';
  $('refresh-now').onclick=refreshSnapshot;$('live-updates').onchange=scheduleRefresh;$('refresh-minutes').onchange=scheduleRefresh;scheduleRefresh();
}
setup();
</script>
</body>
</html>
