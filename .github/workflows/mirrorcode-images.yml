name: MirrorCode existing-image native64 resource QA
on:
  workflow_dispatch:
    inputs:
      target:
        description: Already built target for authored native64 resource QA
        type: choice
        options: [cprepro, sed]
        required: true
permissions:
  contents: read
jobs:
  target-native64:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MIRRORCODE_QA_TARGET: ${{ inputs.target }}
      MC_IMAGE_NAME: ghcr.io/pablorom2004/mirrorcode
      MIRRORCODE_QA_EXPECTED_PINS: scripts/mirrorcode_native64_images.json
      MIRRORCODE_QA_RESOURCE_OUTPUT: run-artifacts/native64-resource-samples.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set ephemeral anonymous image and proof paths
        run: |
          echo "MIRRORCODE_QA_IMAGE_PINS=$RUNNER_TEMP/native64-target-pins.json" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/anonymous-docker" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
      - uses: docker/setup-buildx-action@v3
      - uses: astral-sh/setup-uv@v7
      - name: Install reviewed runtime
        run: uv sync --python 3.13 --extra mirrorcode
      - name: Verify existing immutable manifests and anonymous pulls
        run: uv run python scripts/mirrorcode_existing_image_pins.py
      - name: Record actual hosted runner resources
        run: |
          free -b > "$RUNNER_TEMP/native64-host-memory.txt"
          df -B1 > "$RUNNER_TEMP/native64-host-disk.txt"
          nproc > "$RUNNER_TEMP/native64-host-cpus.txt"
      - name: Native64 peer caps, eight concurrent pipelines and real final grading
        run: uv run python scripts/mirrorcode_native64_resources.py scripts/mirrorcode_native64_qa.py
      - name: Exact-image disposable container cleanup
        if: always()
        run: |
          uv run python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          expected=json.loads(Path(os.environ['MIRRORCODE_QA_EXPECTED_PINS']).read_text())[os.environ['MIRRORCODE_QA_TARGET']]
          configs=set()
          for ref in expected.values():
              result=subprocess.run(['docker','image','inspect',ref],capture_output=True,text=True)
              if result.returncode==0: configs.add(json.loads(result.stdout)[0]['Id'])
          ids=subprocess.run(['docker','ps','--quiet'],capture_output=True,text=True,check=True).stdout.splitlines()
          owned=[]
          for container in ids:
              item=json.loads(subprocess.run(['docker','inspect',container],capture_output=True,text=True,check=True).stdout)[0]
              if item['Image'] in configs or item['Config']['Image'] in expected.values(): owned.append({'id':item['Id'],'image_ref':item['Config']['Image'],'config_id':item['Image']})
          if owned: subprocess.run(['docker','rm','-f',*[item['id'] for item in owned]],check=True)
          Path('run-artifacts').mkdir(exist_ok=True)
          Path('run-artifacts/native64-disposable-cleanup.json').write_text(json.dumps({'owned_before_cleanup':owned,'removed_ids':[item['id'] for item in owned]},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-${{ inputs.target }}-native64-resource-qa
          path: |
            run-artifacts/remote-*-native64-qa/
            run-artifacts/native64-resource-samples*.json
            run-artifacts/native64-disposable-cleanup.json
            ${{ runner.temp }}/native64-target-pins*.json
            ${{ runner.temp }}/native64-host-*.txt
          retention-days: 7
