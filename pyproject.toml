[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "collaboration-index"
version = "0.1.0"
description = "Inspect AI benchmarks of emergent multi-agent collaboration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "inspect-ai==0.3.277",
  "fastapi>=0.141,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "mcp>=1.10,<2",
  "sqlalchemy>=2,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
hle = ["datasets>=4,<5"]
# MirrorCode supplies the sandbox, tools and scorer for the team variant; it needs Python 3.13
mirrorcode = [
  "mc @ git+https://github.com/epoch-research/MirrorCode@5c9d7b00b0c6d7609003e33896cd41d28f092fcb ; python_version >= '3.13'",
]

inferencebench = [
  "asyncssh>=2.24.0",
  "ddgs>=9.16.0",
  "fsspec>=2023.1.0",
  "inspect-sandboxes==0.5.0",
  "modal==1.5.5",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.13", "mypy>=1.18", "types-PyYAML"]

[project.entry-points.inspect_ai]
collaboration_index = "collaboration_index._registry"

[project.scripts]
collaboration-view = "collaboration_index.viewer:main"
collaboration-replay = "collaboration_index.replay:main"
collaboration-board = "collaboration_index.board.service:main"
collaboration-new = "collaboration_index.scaffold:main"
collaboration-smoke = "collaboration_index.smoke:main"

[tool.hatch.metadata]
# lets the mirrorcode extra pin MirrorCode by commit, which is not published on PyPI
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/collaboration_index"]

[tool.ruff]
target-version = "py312"
extend-exclude = [
  "src/collaboration_index/exploitbench/backend",
  "src/collaboration_index/inferencebench/backend",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/collaboration_index/board/server.py" = ["UP047"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["docker: requires the local Docker daemon"]
addopts = "-m 'not docker'"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "collaboration_index.inferencebench.backend.*"
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = "collaboration_index.exploitbench.backend.*"
follow_imports = "skip"
ignore_errors = true
